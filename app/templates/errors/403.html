{% extends "base.html" %}

{% block title %}Access Denied (403) — InternAI{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🛑</div>
  <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary);">403 — Access Denied</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0.5rem auto 2rem;">
    You do not have permission to access this resource. Administrator privileges are required.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}

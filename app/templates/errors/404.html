{% extends "base.html" %}

{% block title %}Page Not Found (404) — InternAI{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
  <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary);">404 — Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0.5rem auto 2rem;">
    The requested page or resource could not be found. It may have moved or been deleted.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}

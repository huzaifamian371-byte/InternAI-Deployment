{% extends "base.html" %}

{% block title %}Server Error (500) — InternAI{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">💥</div>
  <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary);">500 — Server Error</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0.5rem auto 2rem;">
    An internal server error occurred while processing your request. Please try again in a few moments.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
